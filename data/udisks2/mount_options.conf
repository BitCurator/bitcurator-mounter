# BitCurator udisks2 mount options
#
# Installs to /etc/udisks2/mount_options.conf
#
# Purpose
# -------
# When the read-only USB mount policy is active, USB block devices are marked
# read-only at the block layer (via blockdev --setro, applied by the udev rule
# 99-bitcurator-readonly.rules). Mounting a journaled filesystem read-only can
# still cause the kernel to attempt journal/log recovery, which would fail
# against a read-only block device. The *_ro_defaults keys below tell udisks2
# to apply journal-avoidance options whenever it performs a READ-ONLY mount, so
# such devices mount cleanly without any write attempt.
#
# These keys apply ONLY to read-only mounts (the _ro_ prefix). Read-write mounts
# are unaffected, so this file is safe to install regardless of the current
# policy state -- it is static and does not change when the policy is toggled.
#
# The _ro_allow keys ensure udisks2 will accept these options if they are
# requested explicitly (e.g. by the mounter app's fallback path); without an
# allow entry, udisks2 rejects options outside its built-in whitelist.
#
# Reference: udisks(8), udisks2 mount_options.conf (available since 2.9.0;
# present on Ubuntu 22.04 / 24.04 / 26.04). Verify key syntax on 22.04, which
# carries the oldest udisks2 of the three.

[defaults]

# --- ext3 / ext4: skip journal replay ---
ext4_ro_defaults=noload
ext4_ro_allow=noload,ro,noexec,nodev,noatime,nosuid,umask,uid,gid
ext3_ro_defaults=noload
ext3_ro_allow=noload,ro,noexec,nodev,noatime,nosuid

# ext2 has no journal; nothing special required.

# --- xfs: skip log recovery ---
xfs_ro_defaults=norecovery
xfs_ro_allow=norecovery,ro,noexec,nodev,noatime,nosuid

# --- jfs: skip integrity replay ---
jfs_ro_defaults=nointegrity
jfs_ro_allow=nointegrity,ro,noexec,nodev,noatime,nosuid

# --- reiserfs: skip log replay ---
reiserfs_ro_defaults=nolog
reiserfs_ro_allow=nolog,ro,noexec,nodev,noatime,nosuid

# --- FAT family: no journal; set display-friendly ownership for examiners ---
vfat_ro_defaults=umask=0022,uid=$UID,gid=$GID,shortname=mixed
vfat_ro_allow=ro,noexec,nodev,noatime,nosuid,umask,uid,gid,shortname,flush
exfat_ro_defaults=umask=0022,uid=$UID,gid=$GID
exfat_ro_allow=ro,noexec,nodev,noatime,nosuid,umask,uid,gid

# --- NTFS: no journal replay needed for read-only; the kernel ntfs3 driver is
#     the default from 22.04 on. If a deployment falls back to ntfs-3g, udisks2
#     keys it under "ntfs" -- both stanzas are provided. ---
ntfs3_ro_defaults=umask=0022,uid=$UID,gid=$GID
ntfs3_ro_allow=ro,noexec,nodev,noatime,nosuid,umask,uid,gid
ntfs_ro_defaults=umask=0022,uid=$UID,gid=$GID
ntfs_ro_allow=ro,noexec,nodev,noatime,nosuid,umask,uid,gid

# --- HFS+ ---
hfsplus_ro_defaults=umask=0022,uid=$UID,gid=$GID
hfsplus_ro_allow=ro,noexec,nodev,noatime,nosuid,umask,uid,gid
